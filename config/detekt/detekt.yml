# 기본 규칙 위에 덮어쓰는 값만 둔다. 규칙을 끄려면 ADR이 필요하다(docs/adr).
style:
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    excludes: ['**/test/**', '**/androidTest/**']
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
complexity:
  TooManyFunctions:
    # OkHttp EventListener처럼 콜백을 재정의하는 클래스는 함수 수가 계약에서 정해진다.
    ignoreOverridden: true
    # Room DAO는 쿼리 하나가 함수 하나다.
    ignoreAnnotated: ['Dao']
    # PulseInspector는 화면이 쓰는 단일 계약이라 조회·제어·재실행 함수가 한곳에 모인다.
    thresholdInInterfaces: 16
  LongParameterList:
    # 공개 모델은 data class 대신(이진 호환) 일반 클래스로 두므로 생성자 인자가 필드 수만큼 길다.
    constructorThreshold: 16
    # Room 쿼리 함수의 인자는 SQL 바인딩 변수와 일대일이다.
    ignoreAnnotated: ['Composable', 'Query']
    excludes: ['**/test/**', '**/androidTest/**']
