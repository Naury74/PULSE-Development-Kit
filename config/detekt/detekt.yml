# 기본 규칙 위에 덮어쓰는 값만 둔다. 규칙을 끄려면 ADR이 필요하다(docs/adr).
style:
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    excludes: ['**/test/**', '**/androidTest/**']
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
complexity:
  LongParameterList:
    # 공개 모델은 data class 대신(이진 호환) 일반 클래스로 두므로 생성자 인자가 필드 수만큼 길다.
    constructorThreshold: 16
    ignoreAnnotated: ['Composable']
